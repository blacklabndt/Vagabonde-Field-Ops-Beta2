# Test signal for pushes and pull requests.
#
# This is deliberately NOT a deploy workflow. Cloudflare Workers Builds is
# already wired to this repository and builds from the repo root (see the
# comment in the root package.json); a `wrangler deploy` step here would be
# a second deploy path racing the first, and would need a Cloudflare API
# token stored in GitHub. Edge Functions deploy separately through the
# supabase CLI either way.
#
# Note also what this workflow is not: Workers Builds does not consult
# GitHub check results, so a red run here does not stop a deploy. It tells
# a human the tree is broken; it does not gate anything.
name: CI

on:
  push:
  pull_request:

# A new push to a branch cancels the run still going for the old one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 24.x is what the app is developed against. There is no .nvmrc or
      # engines field to read it from; if one is ever added, point this at
      # it instead of carrying the number in two places.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: vite-app/package-lock.json

      # `ci`, not `install`, so the lockfile is honoured exactly and this run
      # cannot quietly test a different dependency version than local does.
      - name: Install
        run: npm --prefix vite-app ci

      # One command on purpose: `npm test` already fans out into the render
      # check, Biome lint (--error-on-warnings) and the Deno typecheck over
      # every Edge Function, then the node:test suites. Deno is not installed
      # here because it does not need to be — scripts/check-functions.cjs
      # fetches its own pinned deno@2.9.6 through npx, so the version that
      # checks in CI is the version that checks locally.
      - name: Test
        run: npm --prefix vite-app test

      - name: Build
        run: npm --prefix vite-app run build
