# Test every push/PR; ship the Worker and SPA only from the release branch.
# Supabase functions and schema changes retain their separate release process.
name: CI

on:
  push:
  pull_request:
  # A redeploy of the branch as it stands, without an empty commit to carry it.
  workflow_dispatch:

# Let an in-progress deployment finish before processing another release.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 24.x is what the app is developed against. There is no .nvmrc or
      # engines field to read it from; if one is ever added, point this at
      # it instead of carrying the number in two places.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: vite-app/package-lock.json

      # `ci`, not `install`, so the lockfile is honoured exactly and this run
      # cannot quietly test a different dependency version than local does.
      - name: Install
        run: npm --prefix vite-app ci

      # One command on purpose: `npm test` already fans out into the render
      # check, Biome lint (--error-on-warnings) and the Deno typecheck over
      # every Edge Function, then the node:test suites. Deno is not installed
      # here because it does not need to be — scripts/check-functions.cjs
      # fetches its own pinned deno@2.9.6 through npx, so the version that
      # checks in CI is the version that checks locally.
      - name: Test
        run: npm --prefix vite-app test

      - name: Build
        run: npm --prefix vite-app run build

      - name: Deploy Worker and app
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/room/37dbe6165f-beta-2-review' && github.repository == 'blacklabndt/Vagabonde-Field-Ops-Beta2'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: '39d46bd7c717e6215af2079b0dd804c0'
          wranglerVersion: '4.131.1'
          command: deploy --keep-vars --tag ${{ github.sha }} --message "GitHub Actions ${{ github.run_id }} commit ${{ github.sha }}"
